 tableStart(ws,`${S.year}년 ${title} 산출내역(연간)`,'(단위 : 원)',23);widths(ws,[26,17,23,16,12,12,17,13,37,...Array(12).fill(16),18,12]);['과정명','금액','산출내역','단가','수량','횟수','산출금액','실시월','비고',...Array.from({length:12},(_,i)=>`${i+1}월`),'합계','금액=합계'].forEach((v,i)=>put(ws,4,i+1,v,'header'));let n=5,heads=[];rows.forEach(r=>{let start=n,details=r.detail.length?r.detail:[{name:'',price:0,count:1,times:1}];details.forEach((d,i)=>{if(i===0){heads.push(n);put(ws,n,1,r.course);put(ws,n,2,{formula:`SUM(G${start}:G${start+details.length-1})`});put(ws,n,8,r.note);put(ws,n,9,r.place);r.months.forEach((v,m)=>put(ws,n,10+m,v));put(ws,n,22,{formula:`SUM(J${n}:U${n})`});put(ws,n,23,{formula:`IF(B${n}=V${n},"같음","불일치")`})}put(ws,n,3,d.name);put(ws,n,4,d.price);put(ws,n,5,d.count);put(ws,n,6,d.times);put(ws,n,7,{formula:`D${n}*E${n}*F${n}`});n++})});put(ws,n,1,'합계','total');for(let col of [2,...Array.from({length:13},(_,j)=>j+10)]){const letter=ws.getColumn(col).letter;put(ws,n,col,{formula:heads.length?heads.map(r=>`${letter}${r}`).join('+'):'0'},'total')}put(ws,n,23,{formula:`IF(B${n}=V${n},"같음","불일치")`},'total');return ws}
// 같은 시트 생성 함수를 재사용하여 출력 내용과 미리보기의 값이 일치하도록 합니다.
function buildBudgetWorkbook(){
  const wb=new ExcelJS.Workbook();
  wb.creator='성과관리 예산관리';wb.created=new Date();
  reportQuarter(wb.addWorksheet(SHEETNAMES[0]));
  quarterDetail(wb.addWorksheet(SHEETNAMES[1]));
  reportYear(wb.addWorksheet(SHEETNAMES[2]));
  TYPES.forEach((name,i)=>detailSheet(wb.addWorksheet(name),i,name.replace('(연간)','')));
  return wb;
}
function viewCellValue(cell){
  const v=cell.value;
  if(v==null)return '';
  if(typeof v==='number')return money(v);
  if(typeof v==='object'){
    if(v.result!=null)return typeof v.result==='number'?money(v.result):String(v.result);
    if(v.text!=null)return String(v.text);
    if(v.richText)return v.richText.map(x=>x.text).join('');
    if(v.formula)return '='+v.formula;
  }
  return String(v);
}
function viewCellColor(argb){return /^[0-9A-Fa-f]{8}$/.test(argb||'')?'#'+argb.slice(2):null}
function worksheetPreviewHTML(ws){
  const ranges=Object.values(ws._merges||{});
  const merges=new Map(),covered=new Set();
  for(const r of ranges){
    const rg=r.model||r; const top=rg.top,left=rg.left,bottom=rg.bottom,right=rg.right;
    if(!top||!left)continue;
    merges.set(`${top}-${left}`,{rs:bottom-top+1,cs:right-left+1});
    for(let row=top;row<=bottom;row++)for(let col=left;col<=right;col++)if(row!==top||col!==left)covered.add(`${row}-${col}`);
  }
  let out='<table class="sheet-preview-table"><tbody>';
  for(let r=1;r<=ws.rowCount;r++){
    out+='<tr>';
    for(let c=1;c<=ws.columnCount;c++){
      const key=`${r}-${c}`;if(covered.has(key))continue;
      const cell=ws.getCell(r,c),m=merges.get(key),styles=[];
      const bg=viewCellColor(cell.fill?.fgColor?.argb);
      const fg=viewCellColor(cell.font?.color?.argb);
      if(bg)styles.push(`background:${bg}`);
      if(fg)styles.push(`color:${fg}`);
      if(cell.font?.bold)styles.push('font-weight:700');
      if(cell.alignment?.horizontal)styles.push(`text-align:${cell.alignment.horizontal==='center'?'center':cell.alignment.horizontal==='right'?'right':'left'}`);
      out+=`<td ${m?`rowspan="${m.rs}" colspan="${m.cs}"`:''} style="${styles.join(';')}">${esc(viewCellValue(cell))}</td>`;
    }
    out+='</tr>';
  }
  return out+'</tbody></table>';
}
function showSheetPreview(index){
  if(!role()||S.page!=='export')return;
  const target=$('#sheetPreview');if(!target)return;
  document.querySelectorAll('.sheet-select').forEach((el,i)=>el.classList.toggle('selected',i===index));
  if(!window.ExcelJS){target.innerHTML='<div class="sheet-preview-empty">ExcelJS 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</div>';return;}
  try{
    const wb=buildBudgetWorkbook(),ws=wb.worksheets[index];
    target.innerHTML=`<div class="sheet-preview-title"><div><b>${esc(ws.name)}</b><span class="hint"> · ${ws.rowCount}행 · ${ws.columnCount}열</span></div><button class="btn" onclick="exportXlsx()">엑셀 다운로드</button></div><div class="sheet-preview-scroll">${worksheetPreviewHTML(ws)}</div>`;
  }catch(err){target.innerHTML=`<div class="sheet-preview-empty">미리보기 생성 오류: ${esc(err.message)}</div>`;}
}
async function exportXlsx(){if(!role())return toast('담당자만 출력할 수 있습니다');if(!window.ExcelJS)return alert('엑셀 출력 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');let wb=buildBudgetWorkbook();try{let data=await wb.xlsx.writeBuffer(),blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${S.year}년_${S.quarter}분기_예산신청서_8개시트.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('8개 시트 엑셀 파일을 생성했습니다')}catch(err){alert('엑셀 생성 오류: '+err.message)}}
render();if(S.page==='annual')renderDetails();const baseRender=render;render=function(){baseRender();if(S.page==='annual')renderDetails()};
