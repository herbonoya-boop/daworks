 const a={id:uid(),who:member(meId())?.name||S.user||"",at:new Date().toISOString(),action:ACTL[tb]+" "+act,target:String(tg).replace(/\s+/g," ").slice(0,60)};S.acts=[a,...(S.acts||[])].slice(0,200);renderNoti();_sput("acts",a)}
Store.put=async function(tb,rows){const r=[].concat(rows||[]).filter(Boolean);if(r.length)logAct(tb,"수정",r);return _sput(tb,rows)};
Store.del=async function(tb,id){logAct(tb,"삭제",[]);return _sdel(tb,id)};
Store.update=async function(tb,id,f){logAct(tb,"수정",[{name:member(id)?.name||""}]);return _supd(tb,id,f)};
const ago=iso=>{const t=new Date(iso),s=(Date.now()-t)/1000;if(isNaN(s))return "";if(s<60)return "방금";if(s<3600)return Math.floor(s/60)+"분 전";if(s<86400)return Math.floor(s/3600)+"시간 전";return (t.getMonth()+1)+"/"+t.getDate()+" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")};
function renderNoti(){const b=$("#noti-n");if(!b)return;const me=member(meId())?.name,seen=localStorage.getItem("tb-seen")||"",n=(S.acts||[]).filter(a=>String(a.at)>seen&&a.who!==me).length;b.textContent=n>99?"99+":String(n);b.classList.toggle("on",n>0);const p=$("#notp");if(p&&p.classList.contains("show"))drawNoti()}
function drawNoti(){const p=$("#notp"),seen=p.dataset.seen||"",me=member(meId())?.name;p.innerHTML=`<h4>🔔 수정 기록<button id="noti-x">닫기</button></h4>`+((S.acts||[]).slice(0,60).map(a=>{const m=S.members.find(x=>x.name===a.who);return `<div class="na ${String(a.at)>seen&&a.who!==me?"new":""}">${m?av(m,26):""}<div><b>${esc(a.who||"-")}</b> · ${esc(a.action)}${a.target?` <span style="color:#555">“${esc(a.target)}”</span>`:""}<small>${ago(a.at)}</small></div></div>`}).join("")||'<div class="empty">수정 기록이 없습니다</div>');const x=$("#noti-x");if(x)x.onclick=()=>p.classList.remove("show")}
function toggleNoti(e){if(e&&e.stopPropagation)e.stopPropagation();const p=$("#notp");if(p.classList.contains("show")){p.classList.remove("show");return}p.dataset.seen=localStorage.getItem("tb-seen")||"";p.classList.add("show");drawNoti();localStorage.setItem("tb-seen",new Date().toISOString());renderNoti()}
document.addEventListener("pointerdown",e=>{const p=$("#notp");if(p&&p.classList.contains("show")&&!e.target.closest("#notp,#b-noti"))p.classList.remove("show")},true);
function showLogin(msg,signed){$("#login").classList.add("show");const lg=$("#lg-logo"),bi=document.querySelector(".brand img");if(lg&&bi)lg.src=bi.src;
 if(msg)$("#lg-msg").textContent=msg;const inp=$("#lg-id"),b=$("#lg-btn"),ms=$("#lg-ms");if(ms)ms.style.display=Store.demo?"none":"";
 const go=async()=>{let v=inp.value.trim().toLowerCase();if(!v)return;if(!v.includes("@"))v+="@donga.co.kr";
  if(Store.demo){if(!S.members.some(m=>String(m.email||"").toLowerCase()===v)){$("#lg-msg").textContent=v+" 은(는) 등록된 팀원 계정이 아닙니다.";return}localStorage.setItem("tb-me",v);location.reload();return}
  b.disabled=true;const{error}=await Store.sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});b.disabled=false;
  $("#lg-msg").textContent=error?"오류: "+error.message:v+" 메일함에서 로그인 링크를 눌러주세요."};
 b.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)go()};if(ms)ms.onclick=()=>Store.login();
 if(signed&&!Store.demo){const o=document.createElement("button");o.className="btn sm";o.textContent="다른 계정으로 로그인";o.onclick=()=>Store.logout();b.after(o)}
 setTimeout(()=>inp.focus&&inp.focus(),50)}
(async function boot(){bind();Store.init();
 if(!Store.demo){try{if(!await Store.signIn())return showLogin()}catch(e){return showLogin("로그인 오류: "+e.message)}}else S.user=localStorage.getItem("tb-me")||"";
 try{await Store.load()}catch(e){toast("불러오기 실패: "+e.message,1);if(!Store.demo)return showLogin("Supabase 연결 실패: "+e.message+" · CONFIG의 URL·키와 SQL 실행 여부를 확인하세요",1)}
 if(!S.members.some(m=>m.email&&String(m.email).toLowerCase()===String(S.user).toLowerCase()))return showLogin(S.user?S.user+" 계정은 팀원으로 등록되지 않았습니다.":"",!!S.user);
 render();
 if(!Store.demo)Store.live()})();
</script></body></html>
